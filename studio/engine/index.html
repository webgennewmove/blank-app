<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #000; } canvas { display: block; max-width: 100vw; }</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
import { createPlayer } from './player.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
await document.fonts.load('900 80px Inter');
const episode = (await import(`../episodes/${q.get('ep')}.js`)).default;
const words = await (await fetch(`../audio/${q.get('ep')}/words.json`)).json();
const player = await createPlayer(episode, { width: W, height: H, words, env: window.__env ?? [], envRate: 60 });
window.__duration = player.duration;
window.__script = player.shots;
window.__mix = player.mix;
window.__frame = (t) => { player.renderAt(t); return document.getElementById('out').toDataURL('image/jpeg', 0.93); };
window.__ready = true;
</script>
</body>
</html>
